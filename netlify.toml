[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/impressum.html"
  to = "/impressum"
  status = 301

[[redirects]]
  from = "/datenschutz.html"
  to = "/datenschutz"
  status = 301
